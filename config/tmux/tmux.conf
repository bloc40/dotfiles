# ------------------------------------------------------------
# --- Key Binding --------------------------------------------
# ------------------------------------------------------------

# --- Set the prefix from C-b to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- reload this file in the current session
bind r source-file ~/.config/tmux/tmux.conf \; display 'Reloaded!'

# --- set the horizontal and vertical splits to | and _
bind | split-window -h
bind _ split-window -v

# --- move around panes the vim way
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- cycle through windows with Prefix Ctrl-h and Prefix Ctrl-l
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# --- resize panes (-r for repeat)
bind -r ( resize-pane -L 5
bind -r ) resize-pane -R 5
bind -r - resize-pane -D 5
bind -r + resize-pane -U 5

# --- vim-style copy mode; y and mouse drag copy to the macOS clipboard
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy
unbind p
bind p paste-buffer

# --- kill current session
bind X confirm-before -p 'kill session #S? (y/n)' kill-session

# --- issue commands in many panes simultaneously
bind C-s set-window-option synchronize-panes

bind a choose-tree

# ------------------------------------------------------------
# --- Configuration ------------------------------------------
# ------------------------------------------------------------

# --- no delay after Escape (vim responsiveness)
set -s escape-time 0

# --- pass focus events through so vim's FocusLost autosave works
set -g focus-events on

# --- start window and pane indexes at 1
set -g base-index 1
setw -g pane-base-index 1

# --- enable the mouse
set -g mouse on

# --- true color
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'

# --- define border colors for active pane
set -g pane-border-style fg=green,bg=black
set -g pane-active-border-style fg=black,bg=green

# --- vi keys in copy mode
setw -g mode-keys vi

set -g history-limit 100000

# ------------------------------------------------------------
# --- Status Bar ---------------------------------------------
# ------------------------------------------------------------

# --- keep the status line at the bottom
set -g status-position bottom

# --- change the colors of the status bar
set -g status-style fg=black,bg=colour236

# --- style the window list
setw -g window-status-style fg=cyan,bg=default
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour166,bold]#W#[fg=colour118]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250,dim]#W#[fg=colour124]#F '

# --- customize the command line
set -g message-style fg=black,bg=colour202

# --- left: session name
set -g status-left-length 40
set -g status-left ' #[fg=colour197,bold][#[fg=colour112]#S#[fg=red]] '

# --- right: moon phase, battery, clock (blue clock while the prefix is active)
set -g status-right "#(~/.config/tmux/moonphase) #[fg=red,bg=colour235,bold] #(~/.config/tmux/battery Discharging)#[fg=green,bg=colour235,bold]#(~/.config/tmux/battery Charging) #{?client_prefix,#[fg=blue],#[fg=colour243#,dim]}#[bg=colour234] %R "

# --- refresh the status bar every 60 seconds
set -g status-interval 60

# --- center the window list
set -g status-justify centre

# --- identify activity in other windows
set -g visual-activity on
setw -g monitor-activity on
setw -g window-status-activity-style bg=colour235
